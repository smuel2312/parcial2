# =====================================================================
# Nginx - Proxy inverso (único punto de entrada, puerto 80)
#   /          -> joomla:80
#   /jupyter/  -> jupyter:8888  (con soporte WebSocket)
#   /grafana/  -> grafana:3000  (con soporte WebSocket para Grafana Live)
# =====================================================================

# Valor de la cabecera Connection según exista o no "Upgrade" en la petición
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream joomla_upstream  { server joomla:80;    keepalive 16; }
upstream jupyter_upstream { server jupyter:8888; keepalive 16; }
upstream grafana_upstream { server grafana:3000; keepalive 16; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;

    # Cabeceras comunes inyectadas hacia los backends (Capa 7)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    # Endpoint para el healthcheck del propio contenedor
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------- Jupyter ------------------------------
    location = /jupyter {
        return 301 /jupyter/;
    }

    location /jupyter/ {
        proxy_pass http://jupyter_upstream;

        # WebSockets (kernels de Jupyter): HTTP/1.1 Upgrade
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ------------------------- Grafana ------------------------------
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ------------------------- Joomla -------------------------------
    location / {
        proxy_pass http://joomla_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
    }
}
